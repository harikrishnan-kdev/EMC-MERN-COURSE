<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        box-sizing: border-box;
        padding: 0;
        margin: 0;
      }
      body {
        background-color: rgb(251, 180, 81);
      }
      .ctn {
        display: flex;
        flex-wrap: wrap;
        gap: 20px;
        padding: 15px 5px;
      }
      .box {
        width: 100px;
        height: 100px;
        background-color: bisque;
        border: 1px solid black;
        border-radius: 5px;
        text-align: center;
        box-shadow: 5px 5px 5px black;
      }

      @media screen and (max-width: 400px) {
        body {
          background-color: rgb(233, 154, 245);
          width: 400px;
        }
        .box {
          background-color: blueviolet;
          box-shadow: 5px 5px 5px white;
        }
      }
    </style>
  </head>
  <body>
    <div
      style="
        padding: 58px 90px;
        background-color: aliceblue;
        border-radius: 10px;
        margin: 15px 5px;
      "
    >
      <h1>Hello, There !</h1>
      <p>
        Adjust the screen size to explore the new color. I used
        <i>@media</i> Query in the HTML.
      </p>
    </div>

    <div class="ctn">
      <div class="box"></div>
      <div class="box"></div>
      <div class="box"></div>
      <div class="box"></div>
      <div class="box"></div>
      <div class="box"></div>
      <div class="box"></div>
      <div class="box"></div>
      <div class="box"></div>
      <div class="box"></div>
      <div class="box"></div>
      <div class="box"></div>
    </div>
  </body>
</html>
